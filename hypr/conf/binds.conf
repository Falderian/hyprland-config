$mainMod = SUPER

# ═══════════════════════════════════════════════════════════════
# WINDOW MANAGEMENT
# ═══════════════════════════════════════════════════════════════
bind = $mainMod, RETURN, exec, ghostty
bind = $mainMod, Q, killactive
bind = $mainMod CTRL, SPACE, togglefloating
bind = $mainMod, F, fullscreen

# ═══════════════════════════════════════════════════════════════
# APPLICATION LAUNCHERS
# ═══════════════════════════════════════════════════════════════
bind = $mainMod, E, exec, ~/.config/ml4w/settings/filemanager.sh
bind = $mainMod, B, exec, ~/.config/ml4w/settings/browser.sh

# ═══════════════════════════════════════════════════════════════
# ROFI MENUS
# ═══════════════════════════════════════════════════════════════
bind = $mainMod, R, exec, pkill -x rofi || ~/.config/hypr/scripts/appLauncher.sh
bind = $mainMod, W, exec, pkill -x rofi || ~/.config/hypr/scripts/windowsLauncher.sh
bind = $mainMod, N, exec, pkill -x rofi || ~/.config/hypr/scripts/notificationsHistory.sh
bind = $mainMod, M, exec, pkill -x rofi || ~/.config/hypr/scripts/power_menu.sh

# ═══════════════════════════════════════════════════════════════
# LAYOUT CONTROLS
# ═══════════════════════════════════════════════════════════════
bind = $mainMod, P, pseudo
bind = $mainMod, TAB, workspace, e+1

# ═══════════════════════════════════════════════════════════════
# FOCUS (Arrow Keys)
# ═══════════════════════════════════════════════════════════════
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# ═══════════════════════════════════════════════════════════════
# RESIZE WINDOWS
# ═══════════════════════════════════════════════════════════════
bind = $mainMod SHIFT, left, resizeactive, -20 0
bind = $mainMod SHIFT, right, resizeactive, 20 0
bind = $mainMod SHIFT, up, resizeactive, 0 -20
bind = $mainMod SHIFT, down, resizeactive, 0 20

# ═══════════════════════════════════════════════════════════════
# MOUSE WINDOW OPERATIONS
# ═══════════════════════════════════════════════════════════════
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ═══════════════════════════════════════════════════════════════
# WORKSPACES
# ═══════════════════════════════════════════════════════════════
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# ═══════════════════════════════════════════════════════════════
# SCREENSHOTS
# ═══════════════════════════════════════════════════════════════
bind = $mainMod, F12, exec, hyprshot -m active -o ~/Pictures/Screenshots
bind = $mainMod CTRL, F12, exec, hyprshot -m region -o ~/Pictures/Screenshots
bind = $mainMod SHIFT, F12, exec, hyprshot -m region -o ~/Pictures/Screenshots

# ═══════════════════════════════════════════════════════════════
# MEDIA CONTROLS
# ═══════════════════════════════════════════════════════════════
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioNext, exec, playerctl next

bind = $mainMod, KP_LEFT, exec, playerctl previous
bind = $mainMod, KP_RIGHT, exec, playerctl next
bind = $mainMod, KP_BEGIN, exec, playerctl play-pause
bind = $mainMod, KP_INSERT, exec, playerctld shift

# ═══════════════════════════════════════════════════════════════
# VOLUME
# ═══════════════════════════════════════════════════════════════
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# ═══════════════════════════════════════════════════════════════
# SYSTEM
# ═══════════════════════════════════════════════════════════════
bind = $mainMod CTRL, L, exec, systemctl suspend
bind = $mainMod SHIFT, B, exec, ~/.config/ml4w/scripts/reload-waybar.sh
bind = $mainMod SHIFT, W, exec, ~/.config/ml4w/scripts/reload-hyprpaper.sh
