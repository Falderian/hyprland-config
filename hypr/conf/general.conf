general {
    gaps_in = 5
    gaps_out = 10,15,10,15
    border_size = 2
    layout = dwindle
    resize_on_border = true
    col.active_border = rgba(8fbcbbff) rgba(81a1c1ff) 45deg # Gradient green-blue for active borders    col.inactive_border = rgba(4c566aff) # Subtle inactive border
}

